        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/events:
    get:
      tags: [events]
      summary: Stream de eventos em tempo real (Server-Sent Events)
      description: |
        Resposta `text/event-stream`, **fora do envelope** `{data, meta}` e **sem timeout de requisição**.
        Cada mensagem tem o formato:

        ```
        id: 123
        event: alert.triggered
        data: {"id":123,"type":"alert.triggered","time":"2026-03-01T12:00:00Z","data":{...}}
        ```

        **Tipos.** `server.status_changed`, `alert.triggered`, `alert.acknowledged`, `alert.resolved`, `incident.created`,
        `incident.resolved`, `service.status_changed`, `security.ip_banned` (duráveis, com `id`) e `metrics.updated` (efêmero, sem `id`, **opt-in**:
        precisa constar em `types`; no máximo 1 a cada 5 s por servidor). O tipo sintético `resync` diz ao cliente para recarregar
        o estado pela API (`reason`: `gap`, `ahead`, `too_many`, `overflow`, `error`).

        **Reconexão.** Eventos duráveis têm `id` crescente em ordem de confirmação. Ao reconectar, envie `Last-Event-ID` (o
        `EventSource` faz isso sozinho) ou `?last_event_id=`: o servidor reenvia o que faltou, em ordem e sem duplicar, e segue
        ao vivo. Se o histórico não estiver mais disponível (retenção de `EVENTS_RETENTION_HOURS`, padrão 24 h), ou forem
        eventos demais (> 1000), ou o id for de outro histórico, o servidor envia `resync`. Sem `Last-Event-ID` só chegam eventos novos.

        **Mantém-se aberto** com comentários `: ping` a cada `SSE_HEARTBEAT_SECONDS` (padrão 15 s). `retry: 5000` sugere 5 s de espera
        antes de reconectar. Um cliente que não acompanha o ritmo recebe `resync` (`overflow`) e é desconectado.

        **Autorização.** Sessão de usuário (cookie), qualquer papel. O `EventSource` nativo funciona com `withCredentials: true`; clientes
        baseados em `fetch` também podem usar `Authorization: Bearer <ADMIN_API_KEY>`. A chave **não** é aceita na URL (vazaria em logs).
        Todos os usuários autenticados verão os mesmos eventos; os payloads não contêm segredos, URLs/alvos, hostnames, tokens nem notas de operadores.

        **Limites.** `SSE_MAX_CLIENTS` (500) e `SSE_MAX_CLIENTS_PER_IP` (20): 503 `STREAM_UNAVAILABLE` / 429 `TOO_MANY_STREAMS`.
        Atrás de Nginx: `proxy_buffering off;` e `proxy_read_timeout` maior que o heartbeat.
      operationId: streamEvents
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - name: types
          in: query
          description: "Lista (vírgulas) de tipos desejados. Padrão: todos os duráveis (sem metrics.updated)."
          schema: { type: string, example: "alert.triggered,service.status_changed" }
        - { name: server_id, in: query, description: Só eventos deste servidor, schema: { type: string, format: uuid } }
        - { name: last_event_id, in: query, description: Equivale ao cabeçalho Last-Event-ID (o cabeçalho tem precedência), schema: { type: integer, minimum: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: integer, minimum: 0 } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Stream aberto
          content:
            text/event-stream:
              schema: { type: string }
              example: "retry: 5000\n: connected\n\nid: 7\nevent: alert.triggered\ndata: {\"id\":7,\"type\":\"alert.triggered\",\"time\":\"2026-03-01T12:00:00Z\",\"data\":{\"alert_id\":\"...\",\"severity\":\"critical\"}}\n\n"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: Limite de conexões ou servidor encerrando (STREAM_UNAVAILABLE), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/agent/heartbeat:
    post:
      tags: [agent]
      summary: Sinal de presença e inventário
      description: O servidor é sempre o associado à credencial; identificadores de servidor no corpo são rejeitados.
      operationId: agentHeartbeat
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Heartbeat" }
      responses:
        "200":
          description: Registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      server_time: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ServerDisabled" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/agent/metrics:
    post:
      tags: [agent]
      summary: Envia uma amostra de métricas
      description: |
        Idempotente por (servidor, `collected_at`): reenviar a mesma amostra devolve 200 com
        `duplicate: true` e não grava de novo. `collected_at` deve estar entre 1 hora no passado
        e 2 minutos no futuro, em relação ao horário de recebimento. Contadores de rede são ACUMULADOS.
        Memória usada = total − disponível.
      operationId: agentMetrics
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricsPayload" }
      responses:
        "200":
          description: Aceita
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stored: { type: boolean }
                      duplicate: { type: boolean }
                      received_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ServerDisabled" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/agent/discovery:
    post:
      tags: [agent]
      summary: Serviços do sistema encontrados no host
      description: |
        Retrato completo dos serviços do catálogo (substitui o anterior). O agente só informa fatos de vocabulário fechado
        (`status`, `source`, `unit`); o texto de `action` é gerado pela API. Um relatório mais antigo que o já gravado é ignorado.
      operationId: agentDiscovery
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentDiscoveryReport" }
      responses:
        "200":
          description: Gravado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stored: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ServerDisabled" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/agent/logs:
    post:
      tags: [agent]
      summary: Lote de logs do servidor (nginx, fail2ban, ufw)
      description: |
        Até 500 entradas e 1 MiB por lote. O servidor vem da credencial. `batch_id` torna o reenvio idempotente: o mesmo lote
        enviado de novo responde `duplicate: true` sem gravar nem anunciar nada. Bans do fail2ban recentes geram o evento SSE
        `security.ip_banned`. Responde **503 `LOGS_UNAVAILABLE`** se o armazenamento de logs não estiver disponível (o agente mantém
        o lote e tenta de novo).
      operationId: agentLogs
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogBatch" }
      responses:
        "200":
          description: Processado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stored: { type: integer }
                      duplicate: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ServerDisabled" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/LogsUnavailable" }
  /api/v1/agent/system-metrics:
    post:
      tags: [agent]
      summary: Lote de métricas de sistema (OOM Killer, inodes, latência de disco, NTP, atualizações, certificados)
      description: |
        Até 500 amostras e 256 KiB por lote, gravadas no ClickHouse. O servidor vem da credencial. `batch_id` torna o reenvio idempotente.
        Alimentam as regras automáticas do catálogo. Responde **503 `LOGS_UNAVAILABLE`** sem ClickHouse (o agente descarta a amostra).
      operationId: agentSystemMetrics
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemMetricBatch" }
      responses:
        "200":
          description: Gravado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { stored: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ServerDisabled" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/LogsUnavailable" }
  /api/v1/agent/config:
    get:
      tags: [agent]
      summary: Parâmetros operacionais do agente (sem segredos nem comandos)
      operationId: agentConfig
      security: [{ agentToken: [] }]
      responses:
        "200":
          description: Configuração
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      collect_interval_seconds: { type: integer, example: 15 }
                      heartbeat_timeout_seconds: { type: integer, example: 60 }
                      max_payload_bytes: { type: integer, example: 65536 }
                      max_disks: { type: integer, example: 64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ServerDisabled" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sentinela_session
      description: |
        Sessão de usuário (cookie `HttpOnly`; com `COOKIE_SECURE` o nome é `__Host-sentinela_session`). Obtida em `POST /auth/login`.
        Requisições que alteram estado (POST/PATCH/DELETE) exigem o cabeçalho **`X-CSRF-Token`** com o `csrf_token` do login/`/auth/me`;
        sem ele a resposta é 403 `CSRF_INVALID`. Se houver cabeçalho `Origin`, deve ser a própria API ou uma origem configurada
        (`CORS_ALLOWED_ORIGINS`), senão 403 `ORIGIN_NOT_ALLOWED`. Sessões expiram por inatividade (`SESSION_IDLE_MINUTES`) e por prazo
        absoluto (`SESSION_ABSOLUTE_HOURS`).
    adminKey:
      type: http
      scheme: bearer
      description: |
        `ADMIN_API_KEY` — credencial de **automação** opcional (desativada quando a variável está vazia), papel `admin`, sem cookie e
        sem CSRF. As ações aparecem na auditoria como `api_key`. Em produção prefira deixá-la vazia e usar usuários.
    agentToken:
      type: http
      scheme: bearer
      description: Token individual do agente (prefixo snt_)
  parameters:
    ServerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Forbidden:
      description: "Papel insuficiente (FORBIDDEN), token CSRF ausente/inválido (CSRF_INVALID) ou origem não permitida (ORIGIN_NOT_ALLOWED)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Credencial ausente, inválida, expirada ou revogada
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Recurso não encontrado
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InvalidId:
      description: Identificador inválido (INVALID_ID)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Nome já em uso (CONFLICT)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Validation:
      description: Dados inválidos (VALIDATION_ERROR) com detalhes por campo
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: VALIDATION_ERROR
              message: Os dados informados são inválidos.
              details: [{ field: cpu.usage_percent, message: deve estar entre 0 e 100 }]
    LogsUnavailable:
      description: Armazenamento de logs desativado ou indisponível (LOGS_UNAVAILABLE)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooLarge:
      description: Corpo acima do limite (PAYLOAD_TOO_LARGE)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServerDisabled:
      description: Servidor desativado (SERVER_DISABLED)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Limite de requisições excedido (RATE_LIMITED); veja o cabeçalho Retry-After
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    AdminStatus:
      type: string
      enum: [active, maintenance, disabled]
      description: Estado administrativo (definido pelo operador)
    ConnectionStatus:
      type: string
      enum: [online, offline, unknown]
      description: Calculado a partir de last_seen_at e AGENT_HEARTBEAT_TIMEOUT_SECONDS; `unknown` = nunca recebeu comunicação
    Server:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hostname: { type: string }
        operating_system: { type: string, nullable: true }
        operating_system_version: { type: string, nullable: true }
        architecture: { type: string, nullable: true }
        agent_version: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/AdminStatus" }
        connection_status: { $ref: "#/components/schemas/ConnectionStatus" }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServerEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Server" }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    Disk:
      type: object
      properties:
        mount_point: { type: string }
        filesystem: { type: string, nullable: true }
        total_bytes: { type: integer, format: int64 }
        used_bytes: { type: integer, format: int64 }
        available_bytes: { type: integer, format: int64 }
        used_percent: { type: number }
        collected_at: { type: string, format: date-time }
    Credential:
      type: object
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
    IssuedCredential:
      allOf:
        - $ref: "#/components/schemas/Credential"
        - type: object
          properties:
            token: { type: string, description: Exibido somente na emissão, example: snt_0123... }
    Host:
      type: object
      properties:
        hostname: { type: string, maxLength: 253 }
        os: { type: string, maxLength: 100 }
        os_version: { type: string, maxLength: 100 }
        architecture: { type: string, maxLength: 32 }
        uptime_seconds: { type: integer, format: int64, minimum: 0 }
    Heartbeat:
      type: object
      required: [agent_version]
      properties:
        agent_version: { type: string, maxLength: 64 }
        host: { $ref: "#/components/schemas/Host" }
    MetricsPayload:
      type: object
      required: [agent_version, collected_at, cpu, memory]
      properties:
        agent_version: { type: string, maxLength: 64 }
        collected_at: { type: string, format: date-time }
        host: { $ref: "#/components/schemas/Host" }
        cpu:
          type: object
          required: [usage_percent]
          properties:
            usage_percent: { type: number, minimum: 0, maximum: 100 }
            count: { type: integer, minimum: 1, maximum: 4096 }
            load_average:
              type: object
              properties:
                m1: { type: number, minimum: 0 }
                m5: { type: number, minimum: 0 }
                m15: { type: number, minimum: 0 }
        memory:
          type: object
          required: [total_bytes, used_bytes, available_bytes]
          properties:
            total_bytes: { type: integer, format: int64, minimum: 1 }
            used_bytes: { type: integer, format: int64 }
            available_bytes: { type: integer, format: int64 }
            swap_total_bytes: { type: integer, format: int64 }
            swap_used_bytes: { type: integer, format: int64 }
        network:
          type: object
          description: Contadores acumulados desde o boot (não são taxas)
          properties:
            rx_bytes_total: { type: integer, format: int64 }
            tx_bytes_total: { type: integer, format: int64 }
        disks:
          type: array
          maxItems: 64
          items:
            type: object
            required: [mount_point, total_bytes, used_bytes, available_bytes]
            properties:
              mount_point: { type: string, description: Caminho absoluto; sem duplicatas na mesma coleta }
              filesystem: { type: string }
              total_bytes: { type: integer, format: int64 }
              used_bytes: { type: integer, format: int64 }
              available_bytes: { type: integer, format: int64 }
      example:
        agent_version: 0.1.0
        collected_at: "2026-03-01T12:00:00Z"
        host: { hostname: web-1, os: Ubuntu, os_version: "24.04", architecture: amd64, uptime_seconds: 86400 }
        cpu: { usage_percent: 12.5, count: 4, load_average: { m1: 0.1, m5: 0.2, m15: 0.3 } }
        memory: { total_bytes: 8589934592, used_bytes: 2147483648, available_bytes: 6442450944, swap_total_bytes: 0, swap_used_bytes: 0 }
        network: { rx_bytes_total: 123456789, tx_bytes_total: 987654321 }
        disks: [{ mount_point: /, filesystem: ext4, total_bytes: 107374182400, used_bytes: 32212254720, available_bytes: 75161927680 }]
    Stat:
      type: object
      description: "Mínimo, média e máximo no balde (nulos quando não há dado, por exemplo sem swap ou sem taxa válida)"
      properties:
        min: { type: number, nullable: true }
        avg: { type: number, nullable: true }
        max: { type: number, nullable: true }
    SeriesMeta:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        interval: { type: string, example: 5m }
        bucket_seconds: { type: integer, description: 0 = amostras originais }
        points: { type: integer }
        max_points: { type: integer, example: 1000 }
    MetricPoint:
      type: object
      properties:
        t: { type: string, format: date-time, description: Início do balde (ou instante da amostra em raw) }
        samples: { type: integer }
        cpu_usage_percent: { $ref: "#/components/schemas/Stat" }
        memory_used_percent: { $ref: "#/components/schemas/Stat" }
        memory_used_bytes: { $ref: "#/components/schemas/Stat" }
        load_average_1m: { $ref: "#/components/schemas/Stat" }
        swap_used_percent: { $ref: "#/components/schemas/Stat" }
        network_rx_bytes_per_sec: { $ref: "#/components/schemas/Stat" }
        network_tx_bytes_per_sec: { $ref: "#/components/schemas/Stat" }
    AggregatedPoint:
      type: object
      properties:
        t: { type: string, format: date-time }
        samples: { type: integer }
        servers: { type: integer, description: Servidores distintos com dados no balde }
        cpu_usage_percent: { $ref: "#/components/schemas/Stat" }
        memory_used_percent: { type: number, nullable: true, description: Σ usado / Σ total }
        load_average_1m: { $ref: "#/components/schemas/Stat" }
    Capacity:
      type: object
      properties:
        used_bytes: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }
        used_percent: { type: number, nullable: true }
    AlertCounts:
      type: object
      properties:
        active: { type: integer }
        critical: { type: integer }
        warning: { type: integer }
        info: { type: integer }
    DashboardSummary:
      type: object
      properties:
        servers:
          type: object
          properties:
            total: { type: integer }
            online: { type: integer }
            offline: { type: integer }
            unknown: { type: integer }
            maintenance: { type: integer }
            disabled: { type: integer }
            with_active_alerts: { type: integer }
        alerts: { $ref: "#/components/schemas/AlertCounts" }
        incidents: { type: object, properties: { open: { type: integer } } }
        resources:
          type: object
          properties:
            reporting_servers: { type: integer, description: Servidores online usados nos agregados }
            cpu:
              type: object
              properties:
                weighted_avg_percent: { type: number, nullable: true }
                max_percent: { type: number, nullable: true }
                top_server: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
                distribution: { type: object, properties: { low: { type: integer }, medium: { type: integer }, high: { type: integer } } }
            memory: { $ref: "#/components/schemas/Capacity" }
            disk: { $ref: "#/components/schemas/Capacity" }
        data_as_of: { type: string, format: date-time, nullable: true, description: Recebimento mais recente entre as amostras usadas }
        updated_at: { type: string, format: date-time }
    ServerSummary:
      type: object
      properties:
        server: { $ref: "#/components/schemas/Server" }
        latest:
          type: object
          nullable: true
          properties:
            collected_at: { type: string, format: date-time }
            received_at: { type: string, format: date-time }
            cpu_usage_percent: { type: number }
            cpu_count: { type: integer, nullable: true }
            load_average: { type: object, properties: { m1: { type: number, nullable: true }, m5: { type: number, nullable: true }, m15: { type: number, nullable: true } } }
            memory:
              type: object
              properties:
                total_bytes: { type: integer, format: int64 }
                used_bytes: { type: integer, format: int64 }
                available_bytes: { type: integer, format: int64 }
                used_percent: { type: number, nullable: true }
                swap_total_bytes: { type: integer, format: int64 }
                swap_used_bytes: { type: integer, format: int64 }
            uptime_seconds: { type: integer, nullable: true }
            network: { type: object, nullable: true, properties: { rx_bytes_per_sec: { type: number }, tx_bytes_per_sec: { type: number } } }
        disks: { type: array, items: { $ref: "#/components/schemas/Disk" } }
        alerts: { $ref: "#/components/schemas/AlertCounts" }
        incidents: { type: object, properties: { open: { type: integer } } }
        services:
          type: object
          properties:
            total: { type: integer }
            up: { type: integer }
            down: { type: integer }
            degraded: { type: integer }
            unknown: { type: integer }
        availability:
          type: object
          properties:
            window_seconds: { type: integer }
            percent: { type: number, nullable: true }
    RecentAlert:
      type: object
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        rule_id: { type: string, format: uuid }
        rule_name: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        status: { type: string, enum: [pending, firing, acknowledged, resolved] }
        message: { type: string }
        triggered_at: { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
    RecentIncident:
      type: object
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid, nullable: true }
        server_name: { type: string, nullable: true }
        title: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        status: { type: string, enum: [open, resolved] }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        duration_seconds: { type: integer, format: int64 }
    Severity: { type: string, enum: [info, warning, critical] }
    MetricName: { type: string, enum: [cpu_usage_percent, memory_used_percent, disk_used_percent, load_average_1m, server_offline, service_down, swap_used_percent, load_per_cpu, oom_kills_10m, inode_used_percent, disk_latency_ms, ntp_unsynchronized, security_updates, cert_days_left] }
    ServiceConfig:
      type: object
      description: Mantido por compatibilidade; sem efeito (os serviços são descobertos automaticamente)
      properties:
        timeout_seconds: { type: integer }
        interval_seconds: { type: integer }
    Service:
      type: object
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        name: { type: string }
        service_type: { type: string, enum: [discovered] }
        target: { type: string, description: Unidade systemd (ou a chave do serviço) }
        config: { $ref: "#/components/schemas/ServiceConfig" }
        status: { type: string, enum: [unknown, up, down, degraded] }
        last_checked_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        last_latency_ms: { type: integer, nullable: true }
        last_status_code: { type: integer, nullable: true }
        consecutive_failures: { type: integer }
        status_changed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentDiscoveryReport:
      type: object
      required: [checked_at, services]
      properties:
        checked_at: { type: string, format: date-time, description: Entre 1 h no passado e 2 min no futuro }
        services:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [key, status]
            properties:
              key: { $ref: "#/components/schemas/DiscoveryKey" }
              status: { $ref: "#/components/schemas/DiscoveryStatus" }
              source: { type: string, enum: [systemd, process, docker], description: Obrigatório quando disponível; proibido quando não encontrado }
              unit: { type: string, maxLength: 128 }
    DiscoveryKey:
      type: string
      enum: [ssh, journald, cron, timesyncd, ufw, rsyslog, nginx, redis, docker, postgresql]
    DiscoveryStatus:
      type: string
      enum: [available, stopped, not_found]
      description: "`available` em execução; `stopped` instalado mas parado/desativado; `not_found` não instalado (nem em container, para redis e postgresql)"
    DiscoveryItem:
      type: object
      required: [key, name, available, status, source, unit, action, checked_at, status_changed_at]
      properties:
        key: { $ref: "#/components/schemas/DiscoveryKey" }
        name: { type: string }
        available: { type: boolean }
        status: { $ref: "#/components/schemas/DiscoveryStatus" }
        source: { type: string, enum: ["", systemd, process, docker], description: Onde foi encontrado }
        unit: { type: string, description: Unidade systemd, quando houver }
        action: { type: string, description: O que fazer para ficar disponível (vazio quando já está) }
        checked_at: { type: string, format: date-time }
        status_changed_at: { type: string, format: date-time, nullable: true }
    ServerDiscovery:
      type: object
      required: [summary, services, checked_at]
      properties:
        summary:
          type: object
          required: [total, available, unavailable]
          properties:
            total: { type: integer }
            available: { type: integer }
            unavailable: { type: integer }
        services: { type: array, items: { $ref: "#/components/schemas/DiscoveryItem" } }
        checked_at: { type: string, format: date-time, nullable: true }
    SystemMetricBatch:
      type: object
      required: [batch_id, samples]
      properties:
        batch_id: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$" }
        samples:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [time, metric, value]
            properties:
              time: { type: string, format: date-time }
              metric: { type: string, enum: [oom_kills, inode_used_percent, disk_latency_ms, ntp_unsynchronized, security_updates, cert_days_left] }
              subject: { type: string, maxLength: 128, description: "Ponto de montagem, dispositivo ou domínio do certificado" }
              value: { type: number }
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [alert_triggered, alert_resolved, ip_banned] }
        priority: { $ref: "#/components/schemas/Priority" }
        severity: { $ref: "#/components/schemas/Severity" }
        server_id: { type: string, format: uuid, nullable: true }
        server_name: { type: string, nullable: true }
        alert_id: { type: string, format: uuid, nullable: true }
        incident_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        message: { type: string }
        data: { type: object, description: Cópia do conteúdo enviado (nomes, horário) }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }
    AlertRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, nullable: true, description: Identificador estável da regra do catálogo }
        name: { type: string }
        description: { type: string }
        metric_name: { $ref: "#/components/schemas/MetricName" }
        operator: { type: string, enum: [">", ">=", "<", "<=", "=="] }
        threshold: { type: number }
        priority: { $ref: "#/components/schemas/Priority" }
        severity: { $ref: "#/components/schemas/Severity" }
        duration_seconds: { type: integer, description: Tempo com a condição verdadeira antes de alertar }
        recovery_seconds: { type: integer, description: Tempo com a condição normalizada antes de resolver }
        server_id: { type: string, format: uuid, nullable: true, description: Sempre nulo; as regras valem para todos os servidores }
        is_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Priority:
      type: integer
      enum: [1, 2, 3, 4]
      description: P1 crítico (notificação imediata), P2 alto, P3 atenção (aparece no painel), P4 informativo (histórico). P1 e P2 têm severidade critical, P3 warning e P4 info.
    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        rule_id: { type: string, format: uuid }
        rule_name: { type: string }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        service_id: { type: string, format: uuid, nullable: true }
        service_name: { type: string, nullable: true }
        incident_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [firing, acknowledged, resolved] }
        priority: { $ref: "#/components/schemas/Priority" }
        severity: { $ref: "#/components/schemas/Severity" }
        message: { type: string }
        value: { type: number, nullable: true }
        triggered_at: { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        acknowledged_by: { type: string, format: uuid, nullable: true, description: Usuário (Fase 6); nulo enquanto o ator é a chave administrativa }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_reason: { type: string, nullable: true, enum: [recovered, manual, rule_disabled, rule_deleted, out_of_scope] }
        last_evaluated_at: { type: string, format: date-time }
    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid, nullable: true }
        server_name: { type: string, nullable: true }
        rule_id: { type: string, format: uuid, nullable: true }
        rule_name: { type: string, nullable: true }
        service_id: { type: string, format: uuid, nullable: true }
        service_name: { type: string, nullable: true }
        title: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        priority: { $ref: "#/components/schemas/Priority" }
        recurrence_count: { type: integer, description: Incidentes iguais (mesmo servidor, regra e serviço) resolvidos nas 24 h anteriores; maior que 0 = reincidente }
        status: { type: string, enum: [open, resolved] }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        duration_seconds: { type: integer, format: int64, description: Incidente aberto = tempo decorrido até agora }
    IncidentDetail:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          properties:
            alerts:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  severity: { $ref: "#/components/schemas/Severity" }
                  message: { type: string }
                  triggered_at: { type: string, format: date-time }
                  resolved_at: { type: string, format: date-time, nullable: true }
    IncidentEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        event_type: { type: string, enum: [opened, alert_triggered, acknowledged, alert_resolved, resolved] }
        message: { type: string }
        created_at: { type: string, format: date-time }
    CreateChannel:
      type: object
      required: [name, bot_token, chat_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        channel_type: { type: string, enum: [telegram], default: telegram }
        bot_token: { type: string, writeOnly: true, example: "123456789:AAH..." }
        chat_id: { type: string, example: "-1001234567890" }
        min_severity: { $ref: "#/components/schemas/Severity" }
        is_enabled: { type: boolean, default: true }
    NotificationChannel:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channel_type: { type: string, enum: [telegram] }
        chat_id: { type: string }
        min_severity: { $ref: "#/components/schemas/Severity" }
        is_enabled: { type: boolean }
        has_token: { type: boolean, description: O token nunca é devolvido }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventEnvelope:
      type: object
      description: Conteúdo de `data:` de cada mensagem SSE
      required: [type, time, data]
      properties:
        id: { type: integer, format: int64, description: Ausente nos eventos efêmeros (metrics.updated) }
        type: { type: string, enum: [server.status_changed, metrics.updated, alert.triggered, alert.acknowledged, alert.resolved, incident.created, incident.resolved, service.status_changed, security.ip_banned, resync] }
        time: { type: string, format: date-time }
        data:
          oneOf:
            - $ref: "#/components/schemas/AlertEventData"
            - $ref: "#/components/schemas/IncidentEventData"
            - $ref: "#/components/schemas/ServiceStatusEventData"
            - $ref: "#/components/schemas/SecurityBanEventData"
            - $ref: "#/components/schemas/ServerStatusEventData"
            - $ref: "#/components/schemas/MetricsUpdatedEventData"
            - $ref: "#/components/schemas/ResyncEventData"
    SecurityBanEventData:
      type: object
      description: security.ip_banned (fail2ban baniu um IP)
      properties:
        ip: { type: string, example: 203.0.113.9 }
        jail: { type: string, example: sshd }
        banned_at: { type: string, format: date-time }
    LogEntry:
      type: object
      required: [time, source, type, severity]
      properties:
        time: { type: string, format: date-time, description: "Até 30 dias no passado, no máximo 5 min no futuro" }
        source: { type: string, enum: [nginx, fail2ban, firewall] }
        type:
          type: string
          description: "nginx: access, access_summary, error. fail2ban: found, ban, unban, already_banned. firewall: block, allow, limit."
        severity: { type: string, enum: [debug, info, warning, error, critical] }
        ip: { type: string, description: IP de origem (IPv4 ou IPv6) }
        port: { type: integer, minimum: 0, maximum: 65535, description: Porta de destino (firewall) }
        status: { type: integer, minimum: 100, maximum: 599, description: Status HTTP (nginx) }
        fields: { type: object, additionalProperties: { type: string }, description: "Até 20 chaves [a-z][a-z0-9_]*, valores de até 512 caracteres" }
        raw: { type: string, description: Linha original (até 2048 caracteres, sem caracteres de controle e sem query string) }
    LogBatch:
      type: object
      required: [batch_id, entries]
      properties:
        batch_id: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$" }
        entries: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/LogEntry" } }
    LogRow:
      allOf:
        - $ref: "#/components/schemas/LogEntry"
        - type: object
          properties:
            server_id: { type: string, format: uuid }
    LogStats:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket_seconds: { type: integer, description: Largura de cada ponto da linha do tempo }
        by_source:
          type: array
          items: { type: object, properties: { source: { type: string }, type: { type: string }, count: { type: integer } } }
        top_ips:
          type: array
          items:
            type: object
            properties:
              ip: { type: string }
              events: { type: integer }
              bans: { type: integer }
              firewall_blocks: { type: integer }
              http_errors: { type: integer }
        top_blocked_ports:
          type: array
          items: { type: object, properties: { port: { type: integer }, blocks: { type: integer } } }
        timeline:
          type: array
          items: { type: object, properties: { time: { type: string, format: date-time }, source: { type: string }, count: { type: integer } } }
        traffic:
          type: array
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              requests: { type: integer }
              errors_4xx: { type: integer }
              errors_5xx: { type: integer }
    AlertEventData:
      type: object
      description: alert.triggered / alert.acknowledged / alert.resolved
      properties:
        alert_id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        service_id: { type: string, format: uuid }
        service_name: { type: string }
        rule_id: { type: string, format: uuid }
        rule_name: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { type: string, enum: [firing, acknowledged, resolved] }
        message: { type: string }
        at: { type: string, format: date-time }
    IncidentEventData:
      type: object
      description: incident.created / incident.resolved
      properties:
        incident_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        service_id: { type: string, format: uuid }
        service_name: { type: string }
        rule_id: { type: string, format: uuid }
        rule_name: { type: string }
        title: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { type: string, enum: [open, resolved] }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
    ServiceStatusEventData:
      type: object
      description: service.status_changed (sem alvo nem mensagem de erro)
      properties:
        service_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        name: { type: string }
        service_type: { type: string, enum: [discovered] }
        previous_status: { type: string, enum: [unknown, up, down, degraded] }
        status: { type: string, enum: [unknown, up, down, degraded] }
        checked_at: { type: string, format: date-time }
    ServerStatusEventData:
      type: object
      description: |
        server.status_changed. Dois casos: mudança de conectividade (`connection_status` + `previous_connection_status`) ou do estado
        administrativo (`status` + `previous_status`). `connection_status` e `status` sempre trazem o valor atual.
      properties:
        server_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, maintenance, disabled] }
        previous_status: { type: string }
        connection_status: { type: string, enum: [online, offline, unknown] }
        previous_connection_status: { type: string }
        at: { type: string, format: date-time }
    MetricsUpdatedEventData:
      type: object
      description: metrics.updated (efêmero; mínimo para atualizar cards)
      properties:
        server_id: { type: string, format: uuid }
        collected_at: { type: string, format: date-time }
        cpu_usage_percent: { type: number }
        memory_used_percent: { type: number, nullable: true }
    ResyncEventData:
      type: object
      description: O cliente deve recarregar o estado pela API REST e continuar ouvindo
      properties:
        reason: { type: string, enum: [gap, ahead, too_many, overflow, error] }
    UserRole: { type: string, enum: [viewer, operator, admin], description: "viewer < operator < admin; cada operação documenta `x-required-role`" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
        password_changed_at: { type: string, format: date-time }
    SessionInfo:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        via: { type: string, enum: [session, api_key] }
        csrf_token: { type: string, description: Enviar em X-CSRF-Token nas requisições que alteram estado }
        expires_at: { type: string, format: date-time, description: Fim absoluto da sessão }
        idle_expires_at: { type: string, format: date-time, description: Vence se não houver uso até este instante (renova a cada uso) }
    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        action: { type: string, example: user.update }
        resource_type: { type: string }
        resource_id: { type: string, nullable: true }
        actor: { type: string, description: "E-mail do usuário, `api_key` ou `sistema`" }
        actor_user_id: { type: string, format: uuid, nullable: true }
        ip: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [message]
                properties:
                  field: { type: string }
                  message: { type: string }
