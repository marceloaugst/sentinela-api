        "200":
          description: Página de serviços
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Service" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/servers/{id}/incidents:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [incidents]
      summary: Incidentes do servidor
      operationId: listServerIncidents
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved] } }
        - { name: severity, in: query, schema: { type: string, enum: [info, warning, critical] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Página de incidentes
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Incident" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/v1/services:
    get:
      tags: [services]
      summary: Lista serviços monitorados
      operationId: listServices
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, description: Busca por nome ou alvo, schema: { type: string, maxLength: 120 } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [up, down, degraded, unknown] } }
        - { name: service_type, in: query, schema: { type: string, enum: [discovered] } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Página de serviços
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Service" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/services/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [services]
      summary: Detalhe do serviço
      operationId: getService
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Serviço
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/alert-rules:
    get:
      tags: [alerts]
      summary: Lista as regras automáticas de alerta (somente leitura)
      description: |
        As regras vêm de um catálogo fixo (CPU, RAM, swap, load, disco, servidor sem comunicação, serviço indisponível)
        sincronizado com o PostgreSQL a cada inicialização da API. Não há cadastro, edição nem exclusão pela API.
        Ordenadas por prioridade (P1 primeiro).
      operationId: listAlertRules
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: metric_name, in: query, schema: { $ref: "#/components/schemas/MetricName" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: priority, in: query, schema: { type: integer, enum: [1, 2, 3, 4] } }
        - { name: enabled, in: query, schema: { type: boolean } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Página de regras
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AlertRule" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/alert-rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [alerts]
      summary: Detalhe da regra
      operationId: getAlertRule
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Regra
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts:
    get:
      tags: [alerts]
      summary: Lista alertas (mais recentes primeiro)
      description: Alertas `pending` (condição verdadeira, ainda dentro de `duration_seconds`) ainda não são alertas e não aparecem.
      operationId: listAlerts
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [active, firing, acknowledged, resolved] }, description: "`active` = firing + acknowledged" }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
        - { name: rule_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: Início (triggered_at >=), schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Fim (triggered_at <), schema: { type: string, format: date-time } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Página de alertas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Alert" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/alerts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [alerts]
      summary: Detalhe do alerta
      operationId: getAlert
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Alerta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Alert" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/alerts/{id}/acknowledge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [alerts]
      summary: Reconhece o alerta (idempotente)
      description: Registra um evento no incidente. Enquanto a autenticação de usuários não existe (Fase 6), o autor é a chave administrativa.
      operationId: acknowledgeAlert
      x-required-role: operator
      security: [{ sessionAuth: [] }, { adminKey: [] }]
