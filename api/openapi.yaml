      tags: [alerts]
      summary: Reconhece o alerta (idempotente)
      description: Registra um evento no incidente. Enquanto a autenticação de usuários não existe (Fase 6), o autor é a chave administrativa.
      operationId: acknowledgeAlert
      x-required-role: operator
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 500 } } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Alerta reconhecido
