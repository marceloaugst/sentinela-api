            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Alert" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Alerta já resolvido (INVALID_STATE), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/alerts/{id}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [alerts]
      summary: Resolve o alerta manualmente (e fecha o incidente)
      description: Se a condição ainda existir, o avaliador abrirá um novo alerta quando voltar a avaliá-la como verdadeira (respeitando `duration_seconds`).
      operationId: resolveAlert
      x-required-role: operator
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
