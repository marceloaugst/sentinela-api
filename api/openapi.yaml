openapi: 3.0.3
info:
  title: Sentinela API
  version: 0.6.0
  description: |
    Fase 6 — API completa com autenticação por sessão, papéis (viewer < operator < admin), CSRF, auditoria e eventos em tempo real (SSE).
    Somente endpoints implementados e testados estão documentados (um teste compara este arquivo com o router).

    **Autenticação:** usuários entram por `POST /api/v1/auth/login` (sessão em cookie `HttpOnly` + cabeçalho `X-CSRF-Token` nas escritas).
    Cada rota exige um papel mínimo (`x-required-role`). `ADMIN_API_KEY` é só uma credencial de automação opcional.
    Os endpoints de agente exigem o token individual do agente (`snt_...`).
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: ops
  - name: servers
  - name: agent-credentials
  - name: agent
  - name: metrics
  - name: dashboard
  - name: services
  - name: alerts
  - name: silences
  - name: incidents
  - name: notifications
  - name: events
  - name: logs
  - name: auth
  - name: users
paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness
      operationId: healthz
      responses:
        "200":
          description: Processo ativo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
                      version: { type: string, example: dev }
  /readyz:
    get:
      tags: [ops]
      summary: Readiness (verifica o PostgreSQL)
      operationId: readyz
      responses:
        "200":
          description: Pronto
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ready }
                      database: { type: string, example: ok }
        "503":
          description: Dependência indisponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /metrics:
    get:
      tags: [ops]
      summary: Métricas Prometheus da própria API
      description: Formato texto do Prometheus (fora do envelope). Restrinja o acesso no proxy reverso.
      operationId: metrics
      responses:
        "200":
          description: Métricas
          content:
            text/plain: { schema: { type: string } }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login (cria a sessão)
      description: |
        Valida e-mail e senha e cria uma **sessão** (cookie `HttpOnly`). A resposta traz o `csrf_token` que o frontend deve enviar
        no cabeçalho `X-CSRF-Token` em toda requisição que altera estado (POST/PATCH/DELETE).

        Toda falha de credencial (senha errada, e-mail inexistente, conta desativada) devolve a **mesma** resposta `401 INVALID_CREDENTIALS`
        e leva o mesmo tempo (sem enumeração de contas). **Bloqueio** (429 `LOGIN_LOCKED`, com `Retry-After`): 5 falhas do mesmo e-mail a partir do
        mesmo IP, 20 falhas de um IP, ou 30 falhas do mesmo e-mail em IPs diferentes, dentro de 15 min; o bloqueio é checado **antes** da senha e se
        desfaz sozinho. Um atacante em outro IP não consegue trancar o usuário legítimo. Endpoint com limite de taxa próprio (429 `RATE_LIMITED`).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Autenticado. Define o cookie de sessão.
          headers:
            Set-Cookie: { schema: { type: string }, description: "sentinela_session (ou __Host-sentinela_session com COOKIE_SECURE); HttpOnly; SameSite; Path=/" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
        "401": { description: Credenciais inválidas (INVALID_CREDENTIALS), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: Corpo acima de 8 KiB, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { description: LOGIN_LOCKED (tentativas demais) ou RATE_LIMITED; veja Retry-After, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Encerra a sessão atual
      operationId: logout
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "204": { description: Sessão revogada e cookie removido }
  /api/v1/auth/logout-all:
    post:
      tags: [auth]
      summary: Encerra todas as sessões do usuário (todos os dispositivos)
      operationId: logoutAll
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "204": { description: Todas as sessões revogadas }
        "400": { description: Chamado com a chave de API (não há sessão), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Usuário autenticado e token CSRF
      description: "Reemite o `csrf_token` (derivado da sessão), útil após recarregar a página. Com a chave de API devolve `via` igual a `api_key` e nenhum token CSRF."
      operationId: me
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Sessão atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Troca a própria senha
      description: |
        Exige a senha atual (cada erro conta para o bloqueio de login). Aplica a política de senhas (12–128 caracteres, sem senhas comuns, sem
        conter e-mail ou nome). **Revoga todas as sessões** e devolve uma sessão nova para este dispositivo (novo cookie e novo `csrf_token`).
      operationId: changePassword
      x-required-role: viewer
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Senha trocada; cookie rotacionado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      csrf_token: { type: string }
                      expires_at: { type: string, format: date-time }
                      idle_expires_at: { type: string, format: date-time }
        "400": { description: Chamado com a chave de API (NOT_A_SESSION), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { description: LOGIN_LOCKED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/users:
    get:
      tags: [users]
      summary: Lista usuários
      operationId: listUsers
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, description: Busca por nome ou e-mail, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/UserRole" } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Página de usuários
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/User" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [users]
      summary: Cria um usuário
      description: Não há cadastro público. A senha segue a política (12–128 caracteres...) e é guardada com Argon2id; nunca é devolvida.
      operationId: createUser
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, password]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/UserRole" }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          description: Criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [users]
      summary: Detalhe do usuário
      operationId: getUser
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidId" }
    patch:
      tags: [users]
      summary: Altera nome, e-mail, papel, estado ou redefine a senha
      description: |
        Desativar (`is_active: false`) ou redefinir a senha **revoga todas as sessões** do usuário imediatamente (`meta.revoked_sessions`).
        Mudanças de papel valem na próxima requisição. O **último administrador ativo** não pode ser desativado nem rebaixado (409 `LAST_ADMIN`).
      operationId: updateUser
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/UserRole" }
                is_active: { type: boolean }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
                  meta: { type: object, properties: { revoked_sessions: { type: integer } } }
        "400": { $ref: "#/components/responses/InvalidId" }
        "409": { description: E-mail em uso (CONFLICT) ou último administrador (LAST_ADMIN), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/users/{id}/sessions/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [users]
      summary: Revoga todas as sessões de um usuário
      operationId: revokeUserSessions
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Sessões revogadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { revoked_sessions: { type: integer } } }
        "400": { $ref: "#/components/responses/InvalidId" }
  /api/v1/logs:
    get:
      tags: [logs]
      summary: Consulta logs (nginx, fail2ban, firewall) — mais recentes primeiro
      description: |
        Logs coletados pelos agentes e guardados no ClickHouse. Período padrão: últimas 24 h; máximo de 31 dias por consulta.
        O conteúdo de `raw`, `ip` e `fields` vem de tráfego externo (User-Agent, URL, usuário do SSH...): **trate como texto não confiável**
        e nunca como HTML. Query strings do nginx não são armazenadas. Os resumos por minuto do nginx (`access_summary`) só aparecem quando pedidos em `type`. Retenção: `LOGS_RETENTION_DAYS` (90).
        Responde **503 `LOGS_UNAVAILABLE`** quando `CLICKHOUSE_URL` não está configurada ou o ClickHouse está fora do ar.
      operationId: listLogs
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
        - { name: source, in: query, schema: { type: string, enum: [nginx, fail2ban, firewall] } }
        - { name: type, in: query, description: "access, access_summary, error, found, ban, unban, already_banned, block, allow, limit", schema: { type: string } }
        - { name: severity, in: query, schema: { type: string, enum: [debug, info, warning, error, critical] } }
        - { name: ip, in: query, description: IP de origem (igualdade), schema: { type: string } }
        - { name: q, in: query, description: Busca (sem diferenciar maiúsculas) no texto original, até 100 caracteres, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Página de registros
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LogRow" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/LogsUnavailable" }
  /api/v1/logs/stats:
    get:
      tags: [logs]
      summary: Resumo dos logs do período (por fonte, IPs mais ativos, portas bloqueadas, linha do tempo)
      description: |
        Aceita os mesmos filtros de `GET /logs` (exceto paginação). `traffic` soma os resumos por minuto do nginx, então reflete o
        volume TOTAL de requisições mesmo quando só erros e requisições suspeitas são gravadas em detalhe.
      operationId: logStats
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
        - { name: source, in: query, schema: { type: string, enum: [nginx, fail2ban, firewall] } }
        - { name: type, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string, enum: [debug, info, warning, error, critical] } }
        - { name: ip, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Estatísticas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LogStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/LogsUnavailable" }

  /api/v1/logs/countries:
    get:
      tags: [logs]
      summary: Atividade dos logs agrupada por país de origem (AbuseIPDB)
      description: |
        Agrupa por IP no ClickHouse (os 1000 mais ativos) e traduz para país pelo cache do AbuseIPDB. Chaves em camelCase.
        `countries[].events` conta a `metric` escolhida; `ips` é o número de IPs distintos e `avgScore` a média (por IP) do `abuse_score`.
        `unknown` reúne IPs privados, ainda não consultados (a consulta é gradual, 20 por requisição) e os fora dos 1000 mais ativos;
        `total` = soma de `countries[].events` + `unknown.events`.
      operationId: logsByCountry
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 31, default: 7 } }
        - { name: metric, in: query, description: "events (padrão), bans, blocks (firewall) ou http_errors", schema: { type: string, enum: [events, bans, blocks, http_errors] } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Totais por país
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      generatedAt: { type: string, format: date-time }
                      periodDays: { type: integer }
                      metric: { type: string }
                      total: { type: integer }
                      countries:
                        type: array
                        items:
                          type: object
                          properties:
                            code: { type: string, example: BR }
                            name: { type: string, example: Brazil }
                            events: { type: integer }
                            ips: { type: integer }
                            avgScore: { type: integer, minimum: 0, maximum: 100 }
                      unknown:
                        type: object
                        properties: { events: { type: integer }, ips: { type: integer } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/LogsUnavailable" }
  /api/v1/audit-logs:
    get:
      tags: [users]
      summary: Trilha de auditoria (mais recentes primeiro)
      description: |
        Registra quem fez o quê: login, usuários, servidores, credenciais de agente, serviços, regras, canais, reconhecimento/resolução de alertas.
        **Nunca** contém senhas, hashes, tokens de sessão/CSRF/agente nem tokens de bots. Retenção: `AUDIT_RETENTION_DAYS` (365).
      operationId: listAuditLogs
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: action, in: query, description: "Igualdade, ou prefixo quando termina com '.' (ex.: `user.`)", schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: actor_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Página de registros
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/v1/servers:
    get:
      tags: [servers]
      summary: Lista servidores
      operationId: listServers
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, description: Busca por nome ou hostname (parcial, sem diferenciar maiúsculas), schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AdminStatus" } }
        - { name: connection, in: query, schema: { $ref: "#/components/schemas/ConnectionStatus" } }
        - { name: sort, in: query, schema: { type: string, enum: [name, hostname, status, created_at, last_seen_at], default: name } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Página de servidores
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Server" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [servers]
      summary: Cadastra um servidor
      operationId: createServer
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, hostname]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                hostname: { type: string, maxLength: 253, description: Nome de host ou IP, sem esquema/porta }
            example: { name: web-1, hostname: web-1.example.com }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          description: Criado (cabeçalho Location aponta para o recurso)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/servers/{id}:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [servers]
      summary: Detalhe do servidor
      operationId: getServer
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Servidor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvelope" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [servers]
      summary: Atualiza nome, hostname ou estado administrativo
      operationId: updateServer
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                hostname: { type: string }
                status: { $ref: "#/components/schemas/AdminStatus" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Servidor atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvelope" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [servers]
      summary: Remove o servidor (exclusão lógica)
      description: |
        O histórico (métricas, alertas, incidentes) é preservado, as credenciais do agente são
        revogadas e o nome fica disponível para reutilização.
      operationId: deleteServer
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "204": { description: Removido }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{id}/disks:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [servers]
      summary: Volumes do servidor (última coleta, um por ponto de montagem)
      operationId: listServerDisks
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Volumes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Disk" } }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{id}/agent-credentials:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [agent-credentials]
      summary: Lista credenciais do servidor (sem token)
      operationId: listAgentCredentials
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Credenciais
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Credential" } }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [agent-credentials]
      summary: Emite uma credencial de agente
      description: |
        O token completo é devolvido **apenas nesta resposta** (`Cache-Control: no-store`);
        o banco guarda somente o hash SHA-256. Com `replace=true` as credenciais ativas
        anteriores são revogadas na mesma transação.
      operationId: issueAgentCredential
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days: { type: integer, minimum: 1, maximum: 3650, description: Sem valor = não expira }
                replace: { type: boolean, default: false }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          description: Credencial emitida
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/IssuedCredential" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/servers/{id}/agent-credentials/{credentialId}:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
      - { name: credentialId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [agent-credentials]
      summary: Revoga uma credencial
      operationId: revokeAgentCredential
      x-required-role: admin
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "204": { description: Revogada }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{id}/summary:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [metrics]
      summary: Resumo do servidor (última amostra, discos, alertas, serviços, disponibilidade)
      description: |
        `latest.network` é a taxa entre as duas últimas amostras e fica nula quando o par não é
        confiável (reset de contador, lacuna > 10 min ou sem dados). `availability` considera a janela
        de 24 h (ou desde o cadastro, se mais recente): cada amostra mantém o servidor online por até
        `AGENT_HEARTBEAT_TIMEOUT_SECONDS`, usando o horário de recebimento. `percent` é nulo se a janela tiver menos de 1 minuto.
      operationId: getServerSummary
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Resumo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServerSummary" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{id}/metrics:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [metrics]
      summary: Histórico de métricas do servidor
      description: |
        Período `[from, to)`; padrão: última hora. Sem `interval`, usa amostras originais (`raw`) para
        períodos de até 1 h e, acima disso, o menor balde que mantém no máximo 1000 pontos. Máximo de 90 dias.
        Cada métrica traz `min/avg/max` (em `raw` os três são iguais). Baldes sem amostras são omitidos.
        Taxas de rede são calculadas entre amostras consecutivas e descartam resets de contador e lacunas > 10 min.
      operationId: getServerMetrics
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: interval, in: query, schema: { type: string, enum: [raw, 1m, 5m, 15m, 1h, 6h, 1d] } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Série temporal
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
                  meta: { $ref: "#/components/schemas/SeriesMeta" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/dashboard/summary:
    get:
      tags: [dashboard]
      summary: Resumo agregado do painel
      description: |
        Recursos consideram apenas servidores **online**, usando a última amostra de cada um.
        Memória e disco: Σ usado / Σ total (nunca média simples de percentuais). CPU: média ponderada pelo
        número de CPUs lógicas, máximo e distribuição (low < 50%, medium 50–80%, high ≥ 80%).
        Alertas e incidentes de servidores removidos não contam.
      operationId: getDashboardSummary
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Resumo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/dashboard/metrics:
    get:
      tags: [dashboard]
      summary: Série agregada de vários servidores
      description: |
        Mesmas regras de período de `/servers/{id}/metrics`, exceto que `raw` não é aceito (mínimo 1m).
        Memória do balde = Σ usado / Σ total das amostras do balde.
      operationId: getDashboardMetrics
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: interval, in: query, schema: { type: string, enum: [1m, 5m, 15m, 1h, 6h, 1d] } }
        - name: server_id
          in: query
          description: Restringe a servidores (UUIDs; repetido ou separado por vírgula; máx. 50). Omitido = todos.
          schema: { type: array, items: { type: string, format: uuid } }
          style: form
          explode: true
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Série agregada
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AggregatedPoint" } }
                  meta: { $ref: "#/components/schemas/SeriesMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/dashboard/recent-alerts:
    get:
      tags: [dashboard]
      summary: Alertas recentes (mais novos primeiro)
      operationId: getRecentAlerts
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: status, in: query, schema: { type: string, enum: [active, pending, firing, acknowledged, resolved] }, description: "`active` = não resolvidos" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Alertas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RecentAlert" } }
                  meta: { type: object, properties: { limit: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/dashboard/recent-incidents:
    get:
      tags: [dashboard]
      summary: Incidentes recentes (mais novos primeiro)
      operationId: getRecentIncidents
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved] } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Incidentes (`duration_seconds` de incidente aberto é o tempo decorrido até agora)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RecentIncident" } }
                  meta: { type: object, properties: { limit: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/v1/servers/{id}/discovery:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [services]
      summary: Serviços do sistema descobertos automaticamente
      description: |
        O agente procura sozinho ssh, systemd-journald, cron, systemd-timesyncd, ufw, rsyslog, nginx, redis, docker e
        postgresql — nada precisa ser cadastrado. Redis e PostgreSQL, se não estiverem no host, são procurados em containers
        Docker. Cada item traz `available` e, quando indisponível, `action` com o que fazer. Sem relatório do agente,
        `services` vem vazio e `checked_at` nulo.
      operationId: listServerDiscovery
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Serviços descobertos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServerDiscovery" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{id}/services/{key}/actions:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
      - { name: key, in: path, required: true, schema: { $ref: "#/components/schemas/DiscoveryKey" } }
    post:
      tags: [services]
      summary: Inicia, para ou reinicia um serviço do servidor
      description: |
        Pede ao agente do servidor para executar `systemctl start|stop|restart` na unidade do serviço. A execução é
        **assíncrona**: responde 202 com o comando (`status: pending`) e o agente o executa em até ~5 s; acompanhe por
        `GET /service-commands/{id}`. Quem pediu (usuário, e-mail e IP) fica gravado no comando e na auditoria (`service.start`,
        `service.stop`, `service.restart`; o resultado vem do agente em `service.result`).
        Regras: só serviços cuja unidade é do systemd (processos soltos e containers Docker não); `start` só se o serviço
        está parado, `stop`/`restart` só se está em execução; o SSH só pode ser iniciado/reiniciado (parar poderia trancar o
        administrador fora do servidor); `journald` e `ufw` não têm ação. A lista do que é permitido agora vem em `actions` de
        `GET /servers/{id}/discovery`. Um comando que o agente não buscar em 2 min expira (`expired`).
        Atenção: parar um serviço fará o alerta "Serviço indisponível" disparar após o tempo da regra.
      operationId: requestServiceAction
      x-required-role: operator
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart] }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "202":
          description: Comando registrado; o agente o executará
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServiceCommand" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Já existe um comando em andamento para o serviço (COMMAND_IN_PROGRESS), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Ação inválida (VALIDATION_ERROR) ou não permitida para o estado do serviço (ACTION_NOT_ALLOWED)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/servers/{id}/service-commands:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [services]
      summary: Comandos de serviço recentes do servidor
      description: Mais recentes primeiro (padrão 20, máximo 100 por `limit`), com quem pediu e o resultado.
      operationId: listServiceCommands
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Comandos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ServiceCommand" } }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/service-commands/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [services]
      summary: Estado de um comando de serviço
      operationId: getServiceCommand
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Comando
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServiceCommand" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{id}/processes:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [services]
      summary: Processos do servidor (CPU e memória)
      description: |
        Último retrato dos processos enviado pelo agente (a cada ~30 s e logo depois de cada encerramento). A lista traz até 300
        processos: os que mais usam CPU e, para completar, os que mais usam memória; `total` é quantos existem no servidor e
        `matched` quantos casam com `q` (antes de `limit`). Threads de kernel não entram. `cpu_percent` vai de 0 a 100 por CPU
        (100 = um núcleo inteiro; o máximo é `100 * cpus`), medido entre duas leituras do /proc. `memory_bytes` é o RSS: páginas
        compartilhadas entre processos (nginx, postgres...) são contadas em cada um, então a soma pode passar da RAM.
        `cmdline` tem os segredos aparentes mascarados (`--password=***`), mas isso é heurístico.
        `actions` é `[terminate, kill]` só nos processos que o agente pode encerrar; nos demais é `[]` e `restriction`
        diz o motivo (`critical`, `self`, `container`, `service`, `other_user`), com o texto em `restriction_message`.
      operationId: getServerProcesses
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [cpu, memory, pid, name], default: cpu } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Filtra por nome, linha de comando, usuário ou pid (sem diferenciar maiúsculas)" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Processos do servidor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServerProcesses" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{id}/processes/history:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [services]
      summary: Histórico dos maiores consumidores de CPU e memória
      description: |
        Quem mais usava CPU e memória no passado, para investigar um pico. A cada leitura do agente (~30 s; ~10 s enquanto a CPU ou a
        RAM estão acima de 85 %) ficam gravados os 5 maiores por CPU e os 5 maiores por memória (união, sem repetir), sem a linha
        de comando. Retenção igual à dos logs (`LOGS_RETENTION_DAYS`). `samples` vem da leitura mais antiga para a mais nova e cada uma
        traz seus processos do maior para o menor CPU. Padrão: última hora; no máximo 7 dias; `truncated: true` se passou de 5000 linhas.
        Processos que viveram menos que o intervalo de leitura podem não aparecer. Exige o ClickHouse (503 `LOGS_UNAVAILABLE` sem ele).
      operationId: getServerProcessHistory
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Início da janela (padrão, uma hora antes de `to`) }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: Fim da janela (padrão, agora) }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: ClickHouse indisponível (LOGS_UNAVAILABLE) }
        "200":
          description: Histórico
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      truncated: { type: boolean }
                      samples:
                        type: array
                        items:
                          type: object
                          properties:
                            at: { type: string, format: date-time }
                            processes:
                              type: array
                              items:
                                type: object
                                properties:
                                  pid: { type: integer }
                                  name: { type: string }
                                  user: { type: string }
                                  cpu_percent: { type: number }
                                  memory_bytes: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{id}/processes/{pid}/actions:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
      - { name: pid, in: path, required: true, schema: { type: integer, minimum: 2 } }
    post:
      tags: [services]
      summary: Encerra um processo
      description: |
        Pede ao agente para encerrar o processo: `terminate` (SIGTERM, pede para sair) ou `kill` (SIGKILL, força). Só vale
        para processos com `actions` na lista, ou seja, do MESMO usuário do agente (ele não roda como root) e fora de serviços
        monitorados (use Parar/Reiniciar), containers e processos do sistema. `start_time` (do item da lista) é obrigatório e
        evita atingir outro processo que reaproveitou o pid. Assíncrono: responde 202 com o comando (`service_key: process`,
        `target: "<pid>:<start_time>"`) e o resultado vem em `GET /service-commands/{id}`. Se o processo ignorar o SIGTERM em
        5 s, o comando termina em `failed` com a dica de usar `kill`. Quem pediu fica na auditoria (`process.terminate`,
        `process.kill`; resultado em `service.result`). Um pedido por processo por vez.
      operationId: requestProcessAction
      x-required-role: operator
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, start_time]
              properties:
                action: { type: string, enum: [terminate, kill] }
                start_time: { type: integer, minimum: 1, description: "Campo start_time do processo na lista" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "202":
          description: Comando registrado; o agente o executará
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServiceCommand" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Já existe um pedido em andamento para este processo (COMMAND_IN_PROGRESS) }
        "422": { description: "Ação inválida, start_time ausente ou processo com restrição (ACTION_NOT_ALLOWED)" }
  /api/v1/servers/{id}/docker:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [services]
      summary: Docker do servidor e seus containers
      description: |
        Diz se o servidor tem Docker e lista todos os containers (ativos e inativos), como o agente os enviou
        (atualizado a cada ~1 min e logo depois de cada ação). `status`: `ok` (lista válida), `not_installed` (sem Docker),
        `no_access` (Docker existe, mas o agente não tem permissão no socket; veja `message`), `unavailable` (instalado, mas o
        daemon não responde) e `unknown` (o agente ainda não informou). Cada container traz `actions`: `restart` se está ativo,
        `start` se está inativo. Nos inativos, `error` explica por que parou e `log_tail` traz o fim do log.
      operationId: getServerDocker
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Estado do Docker
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServerDocker" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{id}/docker/containers/{containerId}/actions:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
      - { name: containerId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" }, description: Id completo do container (campo `id` de GET /servers/{id}/docker) }
    post:
      tags: [services]
      summary: Inicia ou reinicia um container Docker
      description: |
        Pede ao agente para iniciar (container inativo) ou reiniciar (container ativo) o container. Assíncrono, como as ações
        de serviço: responde 202 com o comando e o resultado vem em `GET /service-commands/{id}` (`target` = id do container).
        Se o container não ficar ativo logo depois, o comando termina em `failed` e `message` traz o motivo. Quem pediu fica
        na auditoria (`docker.start`, `docker.restart`; resultado em `service.result`). Um comando por container por vez.
      operationId: requestContainerAction
      x-required-role: operator
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, restart] }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "202":
          description: Comando registrado; o agente o executará
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServiceCommand" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Já existe um comando em andamento para o container (COMMAND_IN_PROGRESS), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Ação inválida (VALIDATION_ERROR) ou incompatível com o estado do container (ACTION_NOT_ALLOWED)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/servers/{id}/services:
    parameters:
      - { $ref: "#/components/parameters/ServerId" }
    get:
      tags: [services]
      summary: Serviços do servidor
      operationId: listServerServices
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
