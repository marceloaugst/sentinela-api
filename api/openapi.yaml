        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Alerta já resolvido (INVALID_STATE), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/silences:
    get:
      tags: [silences]
      summary: Lista silenciamentos e janelas de manutenção (mais recentes primeiro)
      description: |
        `status`: `active` (valendo agora), `scheduled` (começa no futuro) ou `ended` (expirado ou cancelado). Sem `status`, todos.
        Com `server_id`, inclui também as janelas que valem para todos os servidores.
      operationId: listSilences
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [active, scheduled, ended] } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Página de silenciamentos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Silence" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [silences]
      summary: Cria um silenciamento ou uma janela de manutenção
      description: |
        Enquanto a janela vale, os alertas que casam com o escopo (`server_id` e/ou `rule_id`; omitido = todos) continuam sendo
        avaliados, registrados e abrem incidente, mas **não geram notificação externa** (Telegram). Ficam com `silenced: true`
        e uma nota "Notificação silenciada" na linha do tempo do incidente. Se o alerta continuar aberto quando a janela terminar
        (ou for cancelada), a notificação é enviada nesse momento. A recuperação de um alerta cujo disparo foi silenciado não é enviada.

        Informe `ends_at` **ou** `duration_minutes`. `starts_at` é opcional (padrão: agora) e pode ser futuro (até 90 dias), o que
        agenda uma manutenção. Duração máxima: 30 dias. `kind` é só um rótulo: `silence` (padrão) ou `maintenance`.
      operationId: createSilence
      x-required-role: operator
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                kind: { type: string, enum: [silence, maintenance], default: silence }
                reason: { type: string, minLength: 1, maxLength: 300 }
                server_id: { type: string, format: uuid, nullable: true }
                rule_id: { type: string, format: uuid, nullable: true }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                duration_minutes: { type: integer, minimum: 1, maximum: 43200 }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          description: Silenciamento criado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Silence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/silences/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [silences]
      summary: Detalha um silenciamento
      operationId: getSilence
      x-required-role: viewer
      security: [{ sessionAuth: [] }, { adminKey: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Silenciamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Silence" }
        "400": { $ref: "#/components/responses/InvalidId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [silences]
      summary: Encerra o silenciamento agora (ou descarta o agendado)
